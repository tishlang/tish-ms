[package]
name = "tishlang_ms_common"
version = "0.1.0"
edition = "2021"
description = "Shared vnode tree, layout and style helpers for the Windows Tish UI hosts"
license = "MIT"
repository = "https://github.com/tishlang/tish-ms"

[dependencies]
tishlang_core = "4.1.1"
tishlang_ui = { version = "4.1.1", default-features = false, features = ["runtime"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
