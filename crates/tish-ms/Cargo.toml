[package]
name = "tish-ms"
version = "0.1.0"
edition = "2021"
description = "Windows native host for Tish (tish:ms) — OS window + notify"
license = "MIT"
repository = "https://github.com/tishlang/tish-ms"

[dependencies]
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
winit = { version = "0.29", default-features = true }
