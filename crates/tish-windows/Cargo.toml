[package]
name = "tishlang_windows"
version = "0.1.0"
edition = "2021"
description = "Win32 native UI host and system services for Tish JSX (Windows)"
license = "MIT"
repository = "https://github.com/tishlang/tish-ms"

[features]
default = []
# Proof of concept: a WinUI 3 (Windows App SDK) host beside the Win32 one. TISH_WINDOWS_HOST=winui
# picks it at run time.
winui = ["windows/ApplicationModel_Activation", "windows/ApplicationModel_DataTransfer", "windows/ApplicationModel_DataTransfer_DragDrop", "windows/Foundation", "windows/Foundation_Collections", "windows/Graphics", "windows/Graphics_Effects", "windows/Graphics_Imaging", "windows/Storage_Streams", "windows/System", "windows/UI", "windows/UI_Composition", "windows/UI_Core", "windows/UI_Text"]

[dependencies]
tishlang_ms_common = { path = "../tish-ms-common" }
tishlang_core = "4.0.1"
tishlang_ui = { version = "4.0.1", default-features = false, features = ["runtime"] }
# `process` until tish fixes no_console_window on Windows without it.
tishlang_runtime = { version = "4.0.1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-numerics = "0.3"
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Text",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
