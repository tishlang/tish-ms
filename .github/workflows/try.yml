# Run a prebuilt Windows app for a few seconds and capture what it printed and a screenshot of
# the desktop. Started by hand (Windows minutes are costly); the app comes from a release asset.
name: Try an app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release holding the zip"
        required: true
        type: string
      zip:
        description: "Asset name, e.g. moo-windows.zip"
        required: true
        type: string
      exe:
        description: "Executable inside the zip"
        required: true
        type: string
      seconds:
        description: "How long to let it run before the screenshot"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "${{ inputs.zip }}"
          Expand-Archive "${{ inputs.zip }}" -DestinationPath app
      - name: Run, screenshot, stop
        working-directory: app
        run: |
          $p = Start-Process -FilePath ".\${{ inputs.exe }}" -PassThru -RedirectStandardOutput ..\stdout.txt -RedirectStandardError ..\stderr.txt
          Start-Sleep -Seconds ${{ inputs.seconds }}
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("..\screen.png")
          "running: $(-not $p.HasExited)" | Out-File ..\status.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { "exit code: $($p.ExitCode)" | Out-File -Append ..\status.txt }
          Get-Content ..\status.txt, ..\stdout.txt, ..\stderr.txt -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: try-${{ inputs.exe }}
          path: |
            screen.png
            stdout.txt
            stderr.txt
            status.txt
