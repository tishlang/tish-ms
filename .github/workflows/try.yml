# Run a prebuilt Windows app for a few seconds and capture what it printed and a screenshot of
# the desktop. Started by hand (Windows minutes are costly); the app comes from a release asset.
name: Try an app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release holding the zip"
        required: true
        type: string
      zip:
        description: "Asset name, e.g. moo-windows.zip"
        required: true
        type: string
      exe:
        description: "Executable inside the zip"
        required: true
        type: string
      keys:
        description: "Keys to type once it's up (WScript SendKeys syntax), then a second screenshot"
        required: false
        default: ""
        type: string
      env:
        description: "Environment for the app, NAME=value;NAME2=value"
        required: false
        default: ""
        type: string
      after:
        description: "PowerShell to run while the app is up (from the app's folder); its output goes to after.txt"
        required: false
        default: ""
        type: string
      seconds:
        description: "How long to let it run before the screenshot"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ZIP: ${{ inputs.zip }}
        run: |
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p $env:ZIP
          Expand-Archive $env:ZIP -DestinationPath app
      - name: Run, screenshot, stop
        working-directory: app
        # Inputs arrive as environment variables, never pasted into the script.
        env:
          APP_EXE: ${{ inputs.exe }}
          APP_ENV: ${{ inputs.env }}
          APP_KEYS: ${{ inputs.keys }}
          APP_AFTER: ${{ inputs.after }}
          APP_SECONDS: ${{ inputs.seconds }}
        run: |
          foreach ($kv in $env:APP_ENV.Split(";")) { if ($kv -match "=") { $k, $v = $kv.Split("=", 2); [Environment]::SetEnvironmentVariable($k, $v) } }
          $p = Start-Process -FilePath (Join-Path . $env:APP_EXE) -PassThru -RedirectStandardOutput ..\stdout.txt -RedirectStandardError ..\stderr.txt
          Start-Sleep -Seconds ([int]$env:APP_SECONDS)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("..\screen.png")
          if ($env:APP_KEYS -ne "") {
            $sh = New-Object -ComObject WScript.Shell
            $sh.SendKeys($env:APP_KEYS)
            Start-Sleep -Seconds 3
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("..\typed.png")
          }
          if ($env:APP_AFTER -ne "") {
            Push-Location (Split-Path -Parent (Join-Path . $env:APP_EXE))
            & ([ScriptBlock]::Create($env:APP_AFTER)) *>&1 | Out-File ..\after.txt
            Pop-Location
            Copy-Item -ErrorAction SilentlyContinue after.txt ..\after.txt
          }
          "running: $(-not $p.HasExited)" | Out-File ..\status.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { "exit code: $($p.ExitCode)" | Out-File -Append ..\status.txt }
          Get-Content ..\status.txt, ..\stdout.txt, ..\stderr.txt -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: try-${{ github.run_id }}
          path: |
            screen.png
            typed.png
            stdout.txt
            stderr.txt
            status.txt
            after.txt
