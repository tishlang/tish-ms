# Measure the Win32 host on real Windows and smoke-test the services. Started by hand only (Windows minutes are
# costly). The binary is built beforehand (scripts/package-poc.sh) and attached to a release; this
# job runs it three times in bench mode and reports. (The WinUI host is behind the `winui` feature
# and needs the Windows App SDK runtime; see README.)
name: Bench hosts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release holding launcher-poc.zip (from scripts/package-poc.sh)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p launcher-poc.zip
          Expand-Archive launcher-poc.zip -DestinationPath poc
      - name: Run the Win32 host
        working-directory: poc
        run: |
          $env:TISH_BENCH = "1"
          $results = @()
          foreach ($run in 1..3) {
            foreach ($hostName in @("win32")) {
              $out = & .\launcher-poc.exe 2>&1 | Out-String
              Write-Host "== $hostName run $run"; Write-Host $out
              $results += "$hostName $run $out"
            }
          }
          $results | Out-File ../results.txt
          # The app's own exit code isn't the job's result.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results.txt
